{{ define "main" }}

<article class="article">
    <header class="article-header">
        <p class="eyebrow">{{ if eq .Section "posts" }}Post{{ else }}Página{{ end }}</p>
        <h1>{{ .Title }}</h1>
        {{ if eq .Section "posts" }}
        <p class="post-meta">
            <time datetime="{{ .Date.Format "2006-01-02" }}">{{ partial "date-pt-br.html" .Date }}</time>
        </p>
        {{ end }}
        {{ with .Description }}
        <p class="article-description">{{ . }}</p>
        {{ end }}
    </header>

    <div class="article-body">
        {{ .Content }}
    </div>
</article>

{{ end }}
